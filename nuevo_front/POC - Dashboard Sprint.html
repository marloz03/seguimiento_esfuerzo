const GRAD_STATUS = {

  alert:   `linear-gradient(125deg, ${C.navyDeep} 0%, #7A4200 100%)`,

  neutral: `linear-gradient(125deg, ${C.navyDeep} 0%, ${C.navyMid} 100%)`,

// ── MOCK DATA (fallback cuando no hay config.txt válido) ──────────────────────
const MOCK_SPRINT_INFO = {
  proyecto: "TribuDatayAnalitica",
  equipo:   "LinkUp",
  sprint:   "Sprint 24",
  sprintStart: "2026-04-07",
  sprintEnd:   "2026-04-25",
};

// ── CONFIG / API UTILITIES ────────────────────────────────────────────────────
function parseConfig(txt) {
  const cfg = {};
  txt.split('\n').forEach(line => {
    line = line.trim();
    if (!line || line.startsWith('#')) return;
    const idx = line.indexOf('=');
    if (idx < 0) return;
    cfg[line.substring(0, idx).trim()] = line.substring(idx + 1).trim();
  });
  return cfg;
}

function hdrs(cfg) {
  return { 'Authorization': 'Basic ' + btoa(':' + cfg.PAT), 'Content-Type': 'application/json' };
}

function saveMemory(ctx) {
  const keys = ['proyecto','equipo','sprintPath','sprintLabel','sprintStart','sprintEnd'];
  keys.forEach(k => {
    if (ctx[k]) localStorage.setItem('db_' + k, ctx[k]);
    else localStorage.removeItem('db_' + k);
  });
}

function loadMemory() {
  return {
    proyecto:    localStorage.getItem('db_proyecto')    || '',
    equipo:      localStorage.getItem('db_equipo')      || '',
    sprintPath:  localStorage.getItem('db_sprintPath')  || '',
    sprintLabel: localStorage.getItem('db_sprintLabel') || 'Todos',
    sprintStart: localStorage.getItem('db_sprintStart') || null,
    sprintEnd:   localStorage.getItem('db_sprintEnd')   || null,
  };
}

const AZ_FIELDS = [
  'System.Title',
  'System.State',
  'System.AssignedTo',
  'Microsoft.VSTS.Scheduling.StoryPoints',
  'Microsoft.VSTS.Scheduling.DueDate',
  'Custom.Departamento',
  'System.Tags',
  'System.IterationPath',
].join(',');

async function wiqlQuery(cfg, ctx) {
  const { proyecto, equipo, sprintPath } = ctx;
  const areaPath = `${proyecto}\\${equipo}`;
  let where = `[System.WorkItemType] = 'User Story' AND [System.State] <> 'Cancelled'`;
  if (sprintPath) where += ` AND [System.IterationPath] = '${sprintPath}'`;
  const body = {
    query: `SELECT [System.Id] FROM WorkItems WHERE [System.TeamProject] = '${proyecto}' AND [System.AreaPath] UNDER '${areaPath}' AND ${where} ORDER BY [System.ChangedDate] DESC`,
  };
  const r = await fetch(
    `https://dev.azure.com/${cfg.ORG}/${encodeURIComponent(proyecto)}/_apis/wit/wiql?api-version=7.1`,
    { method: 'POST', headers: hdrs(cfg), body: JSON.stringify(body) }
  );
  if (!r.ok) throw new Error(`Error consultando items (${r.status}). Verifica el PAT y permisos.`);
  return ((await r.json()).workItems || []).map(w => w.id);
}

async function fetchItems(cfg, proyecto, ids) {
  if (!ids.length) return [];
  let all = [];
  for (let i = 0; i < ids.length; i += 200) {
    const chunk = ids.slice(i, i + 200);
    const r = await fetch(
      `https://dev.azure.com/${cfg.ORG}/${encodeURIComponent(proyecto)}/_apis/wit/workitems?ids=${chunk.join(',')}&fields=${AZ_FIELDS}&api-version=7.1`,
      { headers: hdrs(cfg) }
    );
    if (!r.ok) throw new Error(`Error cargando items (${r.status})`);
    all = all.concat((await r.json()).value);
  }
  return all;
}

function mapItem(raw) {
  const f = raw.fields;
  const assigned = f['System.AssignedTo'];
  const tags = (f['System.Tags'] || '').toLowerCase();
  const tipo = tags.includes('change') ? 'Change' : 'BAU';
  return {
    id:         raw.id,
    title:      f['System.Title']  || '(sin título)',
    state:      f['System.State']  || 'Backlog',
    assignedTo: assigned ? (assigned.displayName || assigned) : 'Sin asignar',
    sp:         f['Microsoft.VSTS.Scheduling.StoryPoints'] || 0,
    area:       f['Custom.Departamento'] || '',
    due:        f['Microsoft.VSTS.Scheduling.DueDate'] || null,
    tipo,
  };
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function initials(n) {
  if (!n) return '?';
  const p = n.split(' ').filter(Boolean);
  return p.length >= 2 ? (p[0][0] + p[p.length-1][0]).toUpperCase() : n.substring(0,2).toUpperCase();
}

function diasAtraso(due, state) {
  if (!due || state === 'Done') return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.floor((today - new Date(due)) / 86400000);
}

function sprintDayProgress(inicio, fin) {
  if (!inicio || !fin) return 0;
  const s = new Date(inicio), e = new Date(fin);
  const n = new Date(); n.setHours(0,0,0,0);
  const total   = (e - s) / 86400000;
  const elapsed = Math.min(Math.max((n - s) / 86400000, 0), total);
  return Math.round(elapsed / total * 100);
}

function computeStats(items) {
  const committed = items.filter(i => i.state !== 'Backlog');
  const done      = items.filter(i => i.state === 'Done');
  const blocked   = items.filter(i => i.state === 'Blocked');
  const doing     = items.filter(i => i.state === 'Doing');
  const review    = items.filter(i => i.state === 'Revisión Calidad');
  const backlog   = items.filter(i => i.state === 'Backlog');
  const sum       = arr => arr.reduce((s,i) => s + i.sp, 0);
  const spTotal   = sum(committed);
  const spDone    = sum(done);
  const spDoing   = sum(doing);
  const spReview  = sum(review);
  const spBlocked = sum(blocked);
  const spBacklog = sum(backlog);
  const pctItems  = committed.length ? Math.round(done.length / committed.length * 100) : 0;
  const pctSP     = spTotal ? Math.round(spDone / spTotal * 100) : 0;
  const atrasados = committed.filter(i => { const d = diasAtraso(i.due, i.state); return d && d > 0; });
  return { committed, done, blocked, doing, review, backlog, spTotal, spDone, spDoing, spReview, spBlocked, spBacklog, pctItems, pctSP, atrasados };
}

function computeTeam(items) {
  const m = {};
  items.forEach(item => {
    const n = item.assignedTo;
    if (!m[n]) m[n] = { name:n, items:[], spTotal:0, spDone:0 };
    m[n].items.push(item);
    m[n].spTotal += item.sp;
    if (item.state === 'Done') m[n].spDone += item.sp;
  });
  return Object.values(m).sort((a,b) => b.spTotal - a.spTotal);
}

function urgencyScore(item) {
  const d = diasAtraso(item.due, item.state);
  if (item.state === 'Blocked')           return 0;
  if (d && d > 3)                         return 1;
  if (d && d > 0)                         return 2;
  if (item.state === 'Doing')             return 3;
  if (item.state === 'Revisión Calidad')  return 4;
  if (item.state === 'Backlog')           return 5;
  if (item.state === 'Done')              return 99;
  return 6;
}

// ── ICON ──────────────────────────────────────────────────────────────────────

}

ORG=tu_organizacion

// ── HEADER ────────────────────────────────────────────────────────────────────

// ── STATUS HERO ───────────────────────────────────────────────────────────────
function StatusHero({ stats, dayPct, info }) {
  const { blocked, atrasados, pctSP, pctItems, done, committed, spDone, spTotal } = stats;

  let grad, statusLabel, statusSub, statusTag;
  if (blocked.length > 0) {
    grad = GRAD_STATUS.risk; statusTag = 'CRÍTICO';
    statusLabel = 'Sprint en riesgo';
    statusSub = `${blocked.length} item${blocked.length>1?'s':''} bloqueado${blocked.length>1?'s':''}. Se requiere acción inmediata.`;
  } else if (atrasados.length > 0) {
    grad = GRAD_STATUS.alert; statusTag = 'ATENCIÓN';
    statusLabel = 'Sprint con alertas';
    statusSub = `${atrasados.length} item${atrasados.length>1?'s':''} con due date vencida. Revisar con responsables hoy.`;
  } else if (pctSP >= 70) {
    grad = GRAD_STATUS.good; statusTag = 'EN CURSO';
    statusLabel = 'Sprint en buen ritmo';
    statusSub = `${pctSP}% del esfuerzo comprometido entregado. El equipo va al ritmo esperado.`;
  } else {
    grad = GRAD_STATUS.neutral; statusTag = 'EN CURSO';
    statusLabel = 'Sprint en progreso';
    statusSub = `${pctSP}% del esfuerzo entregado. Monitorear que no se acumule al cierre del sprint.`;
  }

  const daysLeft = info.sprintEnd
    ? Math.max(0, Math.round((new Date(info.sprintEnd) - new Date()) / 86400000))
    : null;

  return (
    <div style={{ background:grad, borderRadius:10, padding:'28px 32px', display:'flex', alignItems:'center', gap:32, flexWrap:'wrap', position:'relative', overflow:'hidden' }}>
      <div style={{ position:'absolute', right:-60, top:-60, width:240, height:240, borderRadius:'50%', background:'rgba(255,255,255,0.04)', pointerEvents:'none' }}></div>
      <div style={{ position:'absolute', right:60, bottom:-80, width:180, height:180, borderRadius:'50%', background:'rgba(255,255,255,0.03)', pointerEvents:'none' }}></div>

      <div style={{ flex:1, minWidth:240 }}>
        <div style={{ display:'inline-block', fontSize:10, fontWeight:700, letterSpacing:'0.1em', padding:'3px 8px', borderRadius:3, background:'rgba(255,255,255,0.15)', color:'rgba(255,255,255,0.9)', marginBottom:10 }}>{statusTag}</div>
        <div style={{ fontSize:26, fontWeight:800, color:'#fff', lineHeight:1.1, marginBottom:8 }}>{statusLabel}</div>
        <div style={{ fontSize:13, color:'rgba(255,255,255,0.7)', lineHeight:1.5, maxWidth:420 }}>{statusSub}</div>
      </div>

      <div style={{ display:'flex', gap:0, flexWrap:'wrap' }}>
        {[
          { label:'Tiempo transcurrido', value:`${dayPct}%`,                   sub: daysLeft !== null ? `${daysLeft}d restante${daysLeft!==1?'s':''}` : '—' },
          { label:'Tareas entregadas',   value:`${done.length}/${committed.length}`, sub:`${pctItems}% del compromiso` },
          { label:'Esfuerzo entregado',  value:`${spDone}/${spTotal} SP`,      sub:`${pctSP}% de los SP` },
        ].map((s,i) => (

}

// ── CONTEXT MODAL ─────────────────────────────────────────────────────────────
function ContextModal({ cfg, onApply, onClose, canClose, initialProyecto, initialTeam }) {
  const [proyecto, setProyecto]       = useState(initialProyecto || '');
  const [equipo, setEquipo]           = useState(initialTeam || '');
  const [sprints, setSprints]         = useState([]);
  const [sprintPath, setSprintPath]   = useState('');
  const [sprintLabel, setSprintLabel] = useState('Todos');
  const [sprintStart, setSprintStart] = useState(null);
  const [sprintEnd, setSprintEnd]     = useState(null);
  const [loadingSprints, setLoadingSprints] = useState(false);
  const [err, setErr] = useState('');

  const proyectos = cfg?.PROYECTOS ? cfg.PROYECTOS.split(',').map(p=>p.trim()).filter(Boolean) : [];
  function getEquipos(p) {
    return cfg?.[`EQUIPOS_${p}`] ? cfg[`EQUIPOS_${p}`].split(',').map(e=>e.trim()).filter(Boolean) : [];
  }

  async function loadSprints(p, eq) {
    if (!p || !eq || !cfg?.PAT) return;
    setLoadingSprints(true); setErr(''); setSprints([]);
    try {
      const r = await fetch(
        `https://dev.azure.com/${cfg.ORG}/${encodeURIComponent(p)}/${encodeURIComponent(eq)}/_apis/work/teamsettings/iterations?api-version=7.1`,
        { headers: hdrs(cfg) }
      );
      if (!r.ok) throw new Error(`Error ${r.status} cargando sprints`);
      const data = await r.json();
      const list = (data.value || []).reverse();
      setSprints(list);
      const active = list.find(s => s.attributes?.timeFrame === 'current');
      if (active) {
        setSprintPath(active.path);
        setSprintLabel(active.name);
        setSprintStart(active.attributes?.startDate || null);
        setSprintEnd(active.attributes?.finishDate || null);
      }
    } catch(e) { setErr(e.message); }
    finally { setLoadingSprints(false); }
  }

  useEffect(() => { if (proyecto && equipo) loadSprints(proyecto, equipo); }, []);

  const equipos = getEquipos(proyecto);
  const canApply = proyecto && equipo && !loadingSprints;

  const inputStyle = { width:'100%', padding:'8px 10px', border:`1px solid ${C.border}`, borderRadius:7, fontSize:13, fontFamily:'inherit', color:C.navy, background:'#FAFBFD', outline:'none' };
  const labelStyle = { fontSize:11, fontWeight:600, color:C.muted, textTransform:'uppercase', letterSpacing:'0.06em', display:'block', marginBottom:5 };

  function handleSprintChange(e) {
    const path = e.target.value;
    const selected = sprints.find(s => s.path === path);
    setSprintPath(path);
    if (!path) {
      setSprintLabel('Todos'); setSprintStart(null); setSprintEnd(null);
    } else {
      setSprintLabel(selected?.name || 'Todos');
      setSprintStart(selected?.attributes?.startDate || null);
      setSprintEnd(selected?.attributes?.finishDate || null);
    }
  }

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(6,15,31,0.55)', zIndex:200, display:'flex', alignItems:'center', justifyContent:'center', padding:'2rem' }}>
      <div style={{ background:'#fff', borderRadius:12, padding:'28px 28px 24px', width:'100%', maxWidth:420, boxShadow:'0 20px 60px rgba(0,0,0,0.2)' }}>
        <div style={{ fontWeight:800, fontSize:16, color:C.navy, marginBottom:4 }}>Seleccionar contexto</div>
        <div style={{ fontSize:13, color:C.muted, marginBottom:20 }}>Proyecto → Equipo → Sprint</div>

        <div style={{ marginBottom:14 }}>
          <label style={labelStyle}>Proyecto</label>
          <select value={proyecto} onChange={e=>{ setProyecto(e.target.value); setEquipo(''); setSprints([]); setSprintPath(''); setSprintStart(null); setSprintEnd(null); }} style={inputStyle}>
            <option value="">— Selecciona —</option>
            {proyectos.map(p => <option key={p} value={p}>{p}</option>)}
          </select>
        </div>

        {proyecto && (
          <div style={{ marginBottom:14 }}>
            <label style={labelStyle}>Equipo</label>
            <select value={equipo} onChange={e=>{ setEquipo(e.target.value); setSprints([]); setSprintPath(''); setSprintStart(null); setSprintEnd(null); loadSprints(proyecto, e.target.value); }} style={inputStyle}>
              <option value="">— Selecciona —</option>
              {equipos.map(eq => <option key={eq} value={eq}>{eq}</option>)}
            </select>
          </div>
        )}

        {equipo && (
          <div style={{ marginBottom:14 }}>
            <label style={labelStyle}>Sprint</label>
            {loadingSprints
              ? <div style={{ fontSize:12, color:C.muted, padding:'8px 0', display:'flex', alignItems:'center', gap:8 }}>
                  <div style={{ width:12, height:12, border:`2px solid ${C.border}`, borderTopColor:C.magenta, borderRadius:'50%', animation:'spin 0.7s linear infinite' }}></div>
                  Cargando sprints...
                </div>
              : <select value={sprintPath} onChange={handleSprintChange} style={inputStyle}>
                  <option value="">Todos los sprints</option>
                  {sprints.map(s => (
                    <option key={s.path} value={s.path}>
                      {s.name}{s.attributes?.timeFrame === 'current' ? ' ✓' : ''}
                    </option>
                  ))}
                </select>
            }
          </div>
        )}

        {err && (
          <div style={{ fontSize:12, color:C.red, background:C.redBg, padding:'8px 12px', borderRadius:7, marginBottom:12, border:'1px solid #F7C1C1' }}>{err}</div>
        )}

        <div style={{ display:'flex', gap:8, marginTop:4 }}>
          {canClose && (
            <button onClick={onClose} style={{ padding:'9px 18px', fontSize:13, fontWeight:600, border:`1px solid ${C.border}`, borderRadius:7, background:'#fff', color:C.muted, cursor:'pointer', fontFamily:'inherit' }}>
              Cancelar
            </button>
          )}
          <button
            disabled={!canApply}
            onClick={() => onApply({ proyecto, equipo, sprintPath, sprintLabel, sprintStart, sprintEnd })}
            style={{ flex:1, padding:'9px 18px', fontSize:13, fontWeight:700, border:'none', borderRadius:7, background: canApply ? C.navy : C.faint, color:'#fff', cursor: canApply ? 'pointer' : 'not-allowed', fontFamily:'inherit' }}
          >
            Ver dashboard
          </button>
        </div>
      </div>
    </div>
  );
}

// ── BAU VS CHANGE ─────────────────────────────────────────────────────────────
function BauChangeCard({ items }) {
  const committed = items.filter(i => i.state !== 'Backlog');
  const bau    = committed.filter(i => i.tipo === 'BAU');
  const change = committed.filter(i => i.tipo === 'Change');
  const spBau    = bau.reduce((s,i) => s+i.sp, 0);
  const spChange = change.reduce((s,i) => s+i.sp, 0);
  const total    = committed.length;
  const spTotal  = spBau + spChange;
  const pctBauT  = total  ? Math.round(bau.length / total * 100)  : 0;
  const pctChgT  = total  ? Math.round(change.length / total * 100) : 0;
  const pctBauSP = spTotal ? Math.round(spBau / spTotal * 100) : 0;
  const pctChgSP = spTotal ? Math.round(spChange / spTotal * 100) : 0;

  function Bar({ a, b, colorA, colorB }) {
    return (
      <div style={{ display:'flex', height:10, borderRadius:5, overflow:'hidden', gap:2 }}>
        <div style={{ flex:a||0.001, background:colorA, borderRadius:'5px 0 0 5px', minWidth:4 }}></div>
        <div style={{ flex:b||0.001, background:colorB, borderRadius:'0 5px 5px 0', minWidth:4 }}></div>
      </div>
    );
  }
  function Legend({ color, label, count, pct, unit='' }) {
    return (
      <div style={{ display:'flex', alignItems:'center', gap:6 }}>
        <div style={{ width:8, height:8, borderRadius:2, background:color }}></div>
        <span style={{ fontSize:12, color:C.muted }}>{label}</span>
        <span style={{ fontSize:13, fontWeight:700, color }}>{count}{unit}</span>
        <span style={{ fontSize:11, color:C.faint }}>({pct}%)</span>
      </div>
    );
  }

  return (
    <div style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:10, padding:'20px 24px', display:'flex', flexDirection:'column', gap:16 }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <div>
          <div style={{ fontSize:11, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.07em', color:C.muted, marginBottom:4 }}>Composición del sprint</div>
          <div style={{ fontSize:14, fontWeight:700, color:C.navy }}>BAU vs Change</div>
        </div>
        <Icon name="layers" size={16} color={C.faint} />
      </div>
      <div>
        <div style={{ fontSize:11, color:C.muted, marginBottom:6, fontWeight:500 }}>Tareas ({total})</div>
        <Bar a={bau.length} b={change.length} colorA={C.navy} colorB={C.magenta} />
        <div style={{ display:'flex', justifyContent:'space-between', marginTop:8 }}>
          <Legend color={C.navy}    label="BAU"    count={bau.length}    pct={pctBauT} />
          <Legend color={C.magenta} label="Change" count={change.length} pct={pctChgT} />
        </div>
      </div>
      <div>
        <div style={{ fontSize:11, color:C.muted, marginBottom:6, fontWeight:500 }}>Story Points ({spTotal})</div>
        <Bar a={spBau} b={spChange} colorA={C.navy} colorB={C.magenta} />
        <div style={{ display:'flex', justifyContent:'space-between', marginTop:8 }}>
          <Legend color={C.navy}    label="BAU"    count={spBau}    pct={pctBauSP} unit=" SP" />
          <Legend color={C.magenta} label="Change" count={spChange} pct={pctChgSP} unit=" SP" />
        </div>
      </div>
    </div>
  );
}

function personColor(name, idx) {

function Avatar({ name, idx, size=32 }) {
  const color = personColor(name, idx||0);
  return (
    <div style={{ width:size, height:size, borderRadius:'50%', background:`${color}18`, border:`1.5px solid ${color}40`, color, display:'flex', alignItems:'center', justifyContent:'center', fontSize:size*0.33, fontWeight:700, flexShrink:0 }}>

  'Doing':            { bg:'#EBF0FA', color:'#0B3F8A', label:'Doing' },
  'Blocked':          { bg:C.redBg,   color:C.red,     label:'Bloqueado' },
  'Revisión Calidad': { bg:'#F0EDF9', color:'#5A3A99', label:'En revisión' },
  'Backlog':          { bg:'#F2F3F5', color:C.muted,   label:'Backlog' },
};
function Pill({ state }) {

    <span style={{ display:'inline-block', fontSize:11, fontWeight:600, padding:'3px 8px', borderRadius:4, background:s.bg, color:s.color, whiteSpace:'nowrap' }}>{s.label}</span>

// ── ITEMS TABLE ───────────────────────────────────────────────────────────────
function ItemsTable({ items }) {
  const [filter, setFilter] = useState('todos');
  const [page, setPage]     = useState(1);
  const PAGE_SIZE = 10;
  const rowH = 46;

  const tabs = [
    { id:'todos',      label:'Todos',       count: items.filter(i=>i.state!=='Backlog').length },
    { id:'bloqueados', label:'Bloqueados',  count: items.filter(i=>i.state==='Blocked').length },
    { id:'doing',      label:'En progreso', count: items.filter(i=>i.state==='Doing').length },
    { id:'revision',   label:'En revisión', count: items.filter(i=>i.state==='Revisión Calidad').length },
    { id:'done',       label:'Done',        count: items.filter(i=>i.state==='Done').length },
    { id:'backlog',    label:'Backlog',     count: items.filter(i=>i.state==='Backlog').length },
  ];

  const visible = useMemo(() => {
    let list = [...items];
    if      (filter==='bloqueados') list = list.filter(i=>i.state==='Blocked');
    else if (filter==='doing')      list = list.filter(i=>i.state==='Doing');
    else if (filter==='revision')   list = list.filter(i=>i.state==='Revisión Calidad');
    else if (filter==='done')       list = list.filter(i=>i.state==='Done');
    else if (filter==='backlog')    list = list.filter(i=>i.state==='Backlog');
    else                            list = list.filter(i=>i.state!=='Backlog');
    return list.sort((a,b) => urgencyScore(a) - urgencyScore(b));
  }, [items, filter]);

  const totalPages = Math.ceil(visible.length / PAGE_SIZE);
  const paginated  = visible.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);

  useEffect(() => setPage(1), [filter]);

  const btnPage = (active) => ({
    width:28, height:28, display:'flex', alignItems:'center', justifyContent:'center',
    borderRadius:5, border:`1px solid ${active ? C.navy : C.border}`,
    background: active ? C.navy : '#fff', color: active ? '#fff' : C.muted,
    fontSize:11, fontWeight:600, cursor:'pointer', fontFamily:'inherit',
  });

  return (
    <div style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:10, overflow:'hidden' }}>
      <div style={{ padding:'14px 20px 0', borderBottom:`1px solid ${C.border}` }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14, flexWrap:'wrap', gap:10 }}>
          <div style={{ fontWeight:700, fontSize:14, color:C.navy }}>Items del sprint</div>
          <div style={{ display:'flex', gap:4, flexWrap:'wrap' }}>
            {tabs.map(t => (
              <button key={t.id} onClick={()=>setFilter(t.id)} style={{
                fontSize:11, fontWeight:600, padding:'5px 11px', borderRadius:5,
                border:'1px solid',
                borderColor: filter===t.id ? C.navy : C.border,
                background:  filter===t.id ? C.navy : 'transparent',
                color:       filter===t.id ? '#fff' : C.muted,
                cursor:'pointer', fontFamily:'inherit', transition:'all 0.15s',
              }}>
                {t.label}{t.count>0 ? <span style={{ marginLeft:4, opacity:0.65 }}>{t.count}</span> : ''}
              </button>
            ))}
          </div>
        </div>
      </div>
      <div style={{ overflowX:'auto' }}>
        <table style={{ width:'100%', borderCollapse:'collapse' }}>
          <thead>
            <tr>
              {['Título','Responsable','Estado','Área','Tipo','SP'].map((h,i) => (
                <th key={i} style={{ fontSize:10, fontWeight:600, color:C.muted, textAlign:'left', padding:'8px 16px', background:'#FAFBFD', borderBottom:`1px solid ${C.border}`, textTransform:'uppercase', letterSpacing:'0.06em', whiteSpace:'nowrap' }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {paginated.length===0 && (
              <tr><td colSpan={6} style={{ textAlign:'center', padding:'2.5rem', color:C.faint, fontSize:13 }}>Sin items en esta categoría</td></tr>
            )}
            {paginated.map((item, idx) => {
              const isBlocked = item.state === 'Blocked';
              const dias = diasAtraso(item.due, item.state);
              const atrasado = dias && dias > 0;
              return (
                <tr key={item.id} style={{ borderBottom:`1px solid ${C.borderLight}` }}>
                  <td style={{ padding:`0 16px`, height:rowH, maxWidth:300 }}>
                    <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                      {isBlocked && <div style={{ width:3, height:20, borderRadius:2, background:C.red, flexShrink:0 }}></div>}
                      {atrasado  && <div style={{ width:3, height:20, borderRadius:2, background:C.amber, flexShrink:0 }}></div>}
                      <div style={{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', fontWeight:500, fontSize:13, color:C.navy }}
                           title={item.title}>{item.title}</div>
                    </div>
                  </td>
                  <td style={{ padding:'0 16px', height:rowH }}>
                    <div style={{ display:'flex', alignItems:'center', gap:7 }}>
                      <Avatar name={item.assignedTo} idx={idx} size={22} />
                      <span style={{ fontSize:12, color:C.muted }}>{item.assignedTo.split(' ')[0]}</span>
                    </div>
                  </td>
                  <td style={{ padding:'0 16px', height:rowH }}><Pill state={item.state} /></td>
                  <td style={{ padding:'0 16px', height:rowH }}>
                    {item.area
                      ? <span style={{ fontSize:11, padding:'2px 8px', borderRadius:4, background:C.bg, color:C.muted, border:`1px solid ${C.border}` }}>{item.area}</span>
                      : <span style={{ color:C.faint }}>—</span>}
                  </td>
                  <td style={{ padding:'0 16px', height:rowH }}>
                    <span style={{ fontSize:11, padding:'2px 8px', borderRadius:4, background: item.tipo==='Change' ? C.magentaLight : C.navyLight, color: item.tipo==='Change' ? C.magentaDark : C.navyMid, fontWeight:600 }}>
                      {item.tipo}
                    </span>
                  </td>
                  <td style={{ padding:'0 16px', height:rowH }}>
                    <span style={{ fontSize:13, fontWeight:700, color:item.state==='Done'?C.green:C.navy }}>{item.sp}</span>
                    <span style={{ fontSize:11, color:C.faint, marginLeft:3 }}>SP</span>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {totalPages > 1 && (
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'10px 20px', borderTop:`1px solid ${C.borderLight}` }}>
          <span style={{ fontSize:12, color:C.muted }}>
            {(page-1)*PAGE_SIZE+1}–{Math.min(page*PAGE_SIZE, visible.length)} de {visible.length} items
          </span>
          <div style={{ display:'flex', gap:4 }}>
            <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1} style={{ ...btnPage(false), opacity:page===1?0.4:1 }}>‹</button>
            {Array.from({length:totalPages},(_,i)=>i+1).map(p => (
              <button key={p} onClick={()=>setPage(p)} style={btnPage(p===page)}>{p}</button>
            ))}
            <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={page===totalPages} style={{ ...btnPage(false), opacity:page===totalPages?0.4:1 }}>›</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [showModal, setShowModal] = useState(false);

  const [cfg, setCfg]           = useState(null);
  const [context, setContext]   = useState(null);
  const [realItems, setRealItems] = useState([]);

  const [loading, setLoading]       = useState(true);
  const [loadMsg, setLoadMsg]       = useState('Iniciando...');
  const [configError, setConfigError] = useState(false);
  const [fetchError, setFetchError]   = useState('');
  const [lastUpdate, setLastUpdate]   = useState(null);

  useEffect(() => { initApp(); }, []);

  async function initApp() {
    setLoadMsg('Leyendo config.txt...');
    let loadedCfg = null;
    try {
      const r = await fetch('config.txt');
      if (r.ok) {
        const txt = await r.text();
        const c = parseConfig(txt);
        if (c.PAT && c.PAT !== 'pega_tu_pat_aqui' && c.PROYECTOS && c.ORG) {
          loadedCfg = c;
          setCfg(c);
        }
      }
    } catch(e) {}

    if (loadedCfg) {
      const mem = loadMemory();
      const proyectos = loadedCfg.PROYECTOS.split(',').map(p=>p.trim()).filter(Boolean);
      if (mem.proyecto && proyectos.includes(mem.proyecto) && mem.equipo) {
        const ctx = { proyecto:mem.proyecto, equipo:mem.equipo, sprintPath:mem.sprintPath, sprintLabel:mem.sprintLabel, sprintStart:mem.sprintStart, sprintEnd:mem.sprintEnd };
        setContext(ctx);
        await doLoadData(loadedCfg, ctx);
      } else {
        setLoading(false);
        setShowModal(true);
      }
    } else {
      // No hay config válido → mostrar pantalla de error
      setConfigError(true);
      setLoading(false);
    }
  }

  async function doLoadData(loadedCfg, ctx) {
    setLoading(true);
    setFetchError('');
    try {
      setLoadMsg(`Consultando ${ctx.equipo}...`);
      const ids = await wiqlQuery(loadedCfg, ctx);
      setLoadMsg(`Cargando ${ids.length} item${ids.length!==1?'s':''}...`);
      const raw = ids.length ? await fetchItems(loadedCfg, ctx.proyecto, ids) : [];
      setRealItems(raw.map(mapItem));
      setLastUpdate(new Date());
    } catch(e) {
      setFetchError(e.message);
    }
    setLoading(false);
  }

  // Todos los hooks deben ir ANTES de cualquier return condicional
  const hasCfg   = !!cfg;
  const items    = realItems;
  const info     = context || MOCK_SPRINT_INFO;
  const stats    = useMemo(() => computeStats(items), [items]);
  const dayPct   = sprintDayProgress(info.sprintStart, info.sprintEnd);
  const daysLeft = info.sprintEnd
    ? Math.max(0, Math.round((new Date(info.sprintEnd) - new Date()) / 86400000))
    : null;

  const footerDate = lastUpdate
    ? `Actualizado ${lastUpdate.toLocaleTimeString('es-EC', {hour:'2-digit',minute:'2-digit'})}`
    : '—';

  async function handleRefresh() {
    if (!cfg || !context) return;
    await doLoadData(cfg, context);
  }

  function handleApply(ctx) {
    saveMemory(ctx);
    setContext(ctx);
    setShowModal(false);
    doLoadData(cfg, ctx);
  }

  // Error de config → pantalla de error, sin dashboard
  if (configError) {
    return <ConfigError />;
  }

  // Aún cargando config y no hay contexto todavía
  if (loading && !context) {
    return <Splash message={loadMsg} />;
  }

  return (
    <div style={{ minHeight:'100vh', background:C.bg }}>
      <Header
        info={info}
        onRefresh={handleRefresh}
        onChangeProject={() => setShowModal(true)}
        hasCfg={hasCfg}
        loading={loading}
      />

      <div style={{ maxWidth:1280, margin:'0 auto', padding:'28px 36px 40px', display:'flex', flexDirection:'column', gap:18 }}>

        {/* Error banner al refrescar */}
        {fetchError && (
          <div style={{ background:C.redBg, border:`1px solid #F7C1C1`, borderRadius:8, padding:'10px 16px', fontSize:13, color:C.red }}>
            ⚠ {fetchError}
          </div>
        )}

        <StatusHero stats={stats} dayPct={dayPct} info={info} />

        {/* KPIs */}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(5,1fr)', gap:14 }}>
          <KpiCard
            label="Tiempo del sprint"
            value={`${dayPct}%`}
            valueColor={C.navy}
            sub={daysLeft !== null ? `${daysLeft}d restante${daysLeft!==1?'s':''} · ${info.sprintLabel||info.sprint||''}` : (info.sprintLabel||info.sprint||'—')}
            icon="clock" iconColor={C.muted}
          />
          <KpiCard
            label="Tareas entregadas"
            value={`${stats.done.length}/${stats.committed.length}`}
            valueColor={C.navy}
            sub={`${stats.pctItems}% del compromiso`}
            icon="check" iconColor={C.green}
          />
          <KpiCard
            label="SP entregados"
            value={`${stats.spDone} SP`}
            valueColor={C.magenta}
            sub={`de ${stats.spTotal} comprometidos · ${stats.pctSP}%`}
            icon="layers" iconColor={C.magenta}
          />
          <KpiCard
            label="Items bloqueados"
            value={stats.blocked.length}
            valueColor={stats.blocked.length > 0 ? C.red : C.faint}
            sub={`${stats.spBlocked} SP en bloqueo`}
            icon="lock" iconColor={stats.blocked.length > 0 ? C.red : C.faint}
          />
          <KpiCard
            label="En revisión"
            value={stats.review.length}
            valueColor={C.navy}
            sub={`${stats.spReview} SP listos para validar`}
            icon="chevron" iconColor={C.muted}
          />
        </div>

        {/* Fila de cards */}
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:14, alignItems:'stretch' }}>
          <EsfuerzoCard stats={stats} />
          <BauChangeCard items={items} />
          <TeamGrid items={items} />
        </div>

        <ItemsTable items={items} />

        <div style={{ fontSize:11, color:C.faint, textAlign:'center' }}>
          {info.proyecto} · {info.equipo} · Banco Guayaquil · Azure DevOps · {footerDate}
        </div>
      </div>

      {showModal && hasCfg && (
        <ContextModal
          cfg={cfg}
          onApply={handleApply}
          onClose={() => setShowModal(false)}
          canClose={!!context}
          initialProyecto={context?.proyecto}
          initialTeam={context?.equipo}
        />
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
