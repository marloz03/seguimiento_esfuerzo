// ── HELPERS ───────────────────────────────────────────────────────────────────
function initials(n) {
  if (!n) return "?";
  const p = n.split(" ").filter(Boolean);
  return p.length >= 2 ? (p[0][0] + p[p.length-1][0]).toUpperCase() : n.substring(0,2).toUpperCase();
}
function diasAtraso(due, state) {
  if (!due || state === "Done") return null;
  return Math.floor((TODAY.getTime() - new Date(due).setHours(0,0,0,0)) / 86400000);
}
function sprintDayProgress(inicio, fin) {
  const s = new Date(inicio), e = new Date(fin);
  const total = (e - s) / 86400000;
  const elapsed = Math.min(Math.max((TODAY - s) / 86400000, 0), total);
  return Math.round(elapsed / total * 100);
}
function daysUntilEnd(fin) {
  return Math.max(0, Math.round((new Date(fin) - TODAY) / 86400000));
}
function formatShortDate(iso) {
  if (!iso) return null;
  return new Date(iso).toLocaleDateString("es-EC", { day:"2-digit", month:"short" });
}
function computeStats(items) {
  const committed = items.filter(i => i.state !== "Backlog");
  const done      = items.filter(i => i.state === "Done");
  const blocked   = items.filter(i => i.state === "Blocked");
  const doing     = items.filter(i => i.state === "Doing");
  const review    = items.filter(i => i.state === "Revisión Calidad");
  const backlog   = items.filter(i => i.state === "Backlog");
  const sum       = arr => arr.reduce((s,i) => s + i.sp, 0);
  const spTotal   = sum(committed);
  const spDone    = sum(done);
  const spDoing   = sum(doing);
  const spReview  = sum(review);
  const spBlocked = sum(blocked);
  const spBacklog = sum(backlog);
  const pctItems  = committed.length ? Math.round(done.length / committed.length * 100) : 0;
  const pctSP     = spTotal ? Math.round(spDone / spTotal * 100) : 0;
  const atrasados = committed.filter(i => { const d = diasAtraso(i.due, i.state); return d && d > 0; });
  return { committed, done, blocked, doing, review, backlog, spTotal, spDone, spDoing, spReview, spBlocked, spBacklog, pctItems, pctSP, atrasados };
}
function computeTeam(items, capacity = SP_CAPACITY) {
  const m = {};
  items.forEach(item => {
    const n = item.assignedTo;
    if (!m[n]) m[n] = { name:n, items:[], spTotal:0, spDone:0, spDoing:0 };
    m[n].items.push(item);
    m[n].spTotal += item.sp;
    if (item.state === "Done")  m[n].spDone  += item.sp;
    if (item.state === "Doing") m[n].spDoing += item.sp;
  });
  return Object.values(m).map(p => ({
    ...p,
    capacity,
    pctCapacity:  capacity > 0 ? Math.round(p.spDoing / capacity * 100) : 0,
    overCapacity: p.spDoing > capacity,
    nearCapacity: p.spDoing > 0 && p.spDoing <= capacity && p.spDoing / capacity >= 0.8,
  })).sort((a,b) => b.spDoing - a.spDoing);
}
function urgencyScore(item) {
  const d = diasAtraso(item.due, item.state);
  if (item.state === "Blocked") return 0;
  if (d && d > 3) return 1;
  if (d && d > 0) return 2;
  if (item.state === "Doing") return 3;
  if (item.state === "Revisión Calidad") return 4;
  if (item.state === "Backlog") return 5;
  if (item.state === "Done") return 99;
  return 6;
}

// ── DUE DATE CELL ─────────────────────────────────────────────────────────────
function DueDateCell({ due, state }) {
  if (!due) return <span style={{ color:C.faint, fontSize:12 }}>—</span>;
  const dias = diasAtraso(due, state);
  const dateStr = formatShortDate(due);
  if (state === "Done") return <span style={{ fontSize:12, color:C.green }}>{dateStr}</span>;
  if (dias > 0) return (
    <div style={{ display:"flex", flexDirection:"column", gap:1 }}>
      <span style={{ fontSize:12, fontWeight:600, color:C.red }}>{dateStr}</span>
      <span style={{ fontSize:10, fontWeight:700, color:C.red }}>+{dias}d</span>
    </div>
  );
  if (dias === 0) return (
    <div style={{ display:"flex", flexDirection:"column", gap:1 }}>
      <span style={{ fontSize:12, fontWeight:600, color:C.amber }}>{dateStr}</span>
      <span style={{ fontSize:10, fontWeight:600, color:C.amber }}>hoy</span>
    </div>
  );
  const faltan = Math.abs(dias);
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:1 }}>
      <span style={{ fontSize:12, color:C.muted }}>{dateStr}</span>
      <span style={{ fontSize:10, color:C.faint }}>{faltan === 1 ? "mañana" : `${faltan}d`}</span>
    </div>
  );
}

// ── STATUS HERO ───────────────────────────────────────────────────────────────
function StatusHero({ stats, dayPct, info }) {
  const { blocked, atrasados, pctSP, pctItems, done, committed, spDone, spTotal } = stats;
  let grad, statusLabel, statusSub, statusTag;
  if (blocked.length > 0) {
    grad = GRAD_STATUS.risk;  statusLabel = "Sprint en riesgo";     statusTag = "CRÍTICO";
    statusSub = `${blocked.length} item${blocked.length>1?"s":""} bloqueado${blocked.length>1?"s":""}. Se requiere acción inmediata para desbloquear.`;
  } else if (atrasados.length > 0) {
    grad = GRAD_STATUS.alert; statusLabel = "Sprint con alertas";   statusTag = "ATENCIÓN";
    statusSub = `${atrasados.length} item${atrasados.length>1?"s":""} con due date vencida. Revisar con responsables hoy.`;
  } else if (pctSP >= 70) {
    grad = GRAD_STATUS.good;  statusLabel = "Sprint en buen ritmo"; statusTag = "EN CURSO";
    statusSub = `${pctSP}% del esfuerzo comprometido fue entregado. El equipo va al ritmo esperado.`;
  } else {
    grad = GRAD_STATUS.neutral; statusLabel = "Sprint en progreso"; statusTag = "EN CURSO";
    statusSub = `${pctSP}% del esfuerzo entregado. Monitorear que no se acumule al cierre del sprint.`;
  }
  const restantes = daysUntilEnd(info.fin);

  return (
    <div style={{ background:grad, borderRadius:10, padding:"28px 32px", display:"flex", alignItems:"center", gap:32, flexWrap:"wrap", position:"relative", overflow:"hidden" }}>
      <div style={{ position:"absolute", right:-60, top:-60, width:240, height:240, borderRadius:"50%", background:"rgba(255,255,255,0.04)", pointerEvents:"none" }}></div>
      <div style={{ position:"absolute", right:60, bottom:-80, width:180, height:180, borderRadius:"50%", background:"rgba(255,255,255,0.03)", pointerEvents:"none" }}></div>
      <div style={{ flex:1, minWidth:240 }}>
        <div style={{ display:"inline-block", fontSize:10, fontWeight:700, letterSpacing:"0.1em", padding:"3px 8px", borderRadius:3, background:"rgba(255,255,255,0.15)", color:"rgba(255,255,255,0.9)", marginBottom:10 }}>{statusTag}</div>
        <div style={{ fontSize:26, fontWeight:800, color:"#fff", lineHeight:1.1, marginBottom:8 }}>{statusLabel}</div>
        <div style={{ fontSize:13, color:"rgba(255,255,255,0.7)", lineHeight:1.5, maxWidth:420 }}>{statusSub}</div>
      </div>
      <div style={{ display:"flex", gap:0, flexWrap:"wrap" }}>
        {[
          { label:"Tiempo transcurrido", value:`${dayPct}%`,                        sub:`${restantes}d restante${restantes!==1?"s":""}` },
          { label:"Tareas entregadas",   value:`${done.length}/${committed.length}`, sub:`${pctItems}% del compromiso` },
          { label:"Esfuerzo entregado",  value:`${spDone}/${spTotal} SP`,            sub:`${pctSP}% de los SP` },
        ].map((s,i) => (
          <div key={i} style={{ padding:"0 28px", borderLeft:"1px solid rgba(255,255,255,0.12)", textAlign:"center" }}>
            <div style={{ fontSize:10, fontWeight:600, letterSpacing:"0.06em", textTransform:"uppercase", color:"rgba(255,255,255,0.5)", marginBottom:6 }}>{s.label}</div>
            <div style={{ fontSize:22, fontWeight:800, color:"#fff", lineHeight:1 }}>{s.value}</div>
            <div style={{ fontSize:11, color:"rgba(255,255,255,0.5)", marginTop:4 }}>{s.sub}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

  const [sprint,   setSprint]   = useState(context.sprint);

  const inputStyle = { width:"100%", padding:"8px 10px", border:`1px solid ${C.border}`, borderRadius:7, fontSize:13, fontFamily:"inherit", color:C.navy, background:"#FAFBFD", outline:"none" };
  const labelStyle = { fontSize:11, fontWeight:600, color:C.muted, textTransform:"uppercase", letterSpacing:"0.06em", display:"block", marginBottom:5 };
  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(6,15,31,0.55)", zIndex:200, display:"flex", alignItems:"center", justifyContent:"center", padding:"2rem" }}>
      <div style={{ background:"#fff", borderRadius:12, padding:"28px 28px 24px", width:"100%", maxWidth:420, boxShadow:"0 20px 60px rgba(0,0,0,0.2)" }}>
        <div style={{ fontWeight:800, fontSize:16, color:C.navy, marginBottom:4 }}>Seleccionar contexto</div>
        <div style={{ fontSize:13, color:C.muted, marginBottom:20 }}>Proyecto → Equipo → Sprint · <span style={{ color:C.magenta, fontWeight:600 }}>Modo demo</span></div>
        <div style={{ marginBottom:14 }}>
          <label style={labelStyle}>Proyecto</label>
          <select value={proyecto} onChange={e=>{ setProyecto(e.target.value); setEquipo(""); }} style={inputStyle}>
            {DEMO_PROYECTOS.map(p => <option key={p} value={p}>{p}</option>)}
          </select>
        </div>
        {proyecto && (
          <div style={{ marginBottom:14 }}>
            <label style={labelStyle}>Equipo</label>
            <select value={equipo} onChange={e=>setEquipo(e.target.value)} style={inputStyle}>
              <option value="">— Selecciona —</option>
              {equipos.map(eq => <option key={eq} value={eq}>{eq}</option>)}
            </select>
          </div>
        )}
        {equipo && (
          <div style={{ marginBottom:14 }}>
            <label style={labelStyle}>Sprint</label>
            <select value={sprint} onChange={e=>setSprint(e.target.value)} style={inputStyle}>
              {DEMO_SPRINTS.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
        )}
        <div style={{ display:"flex", gap:8, marginTop:4 }}>
          <button onClick={onClose} style={{ padding:"9px 18px", fontSize:13, fontWeight:600, border:`1px solid ${C.border}`, borderRadius:7, background:"#fff", color:C.muted, cursor:"pointer", fontFamily:"inherit" }}>Cancelar</button>
          <button disabled={!proyecto||!equipo} onClick={()=>onApply({ proyecto, equipo, sprint: sprint.replace(" ✓ activo","") })}
            style={{ flex:1, padding:"9px 18px", fontSize:13, fontWeight:700, border:"none", borderRadius:7, background:(!proyecto||!equipo)?C.faint:C.navy, color:"#fff", cursor:(!proyecto||!equipo)?"not-allowed":"pointer", fontFamily:"inherit" }}>
            Ver dashboard
          </button>
        </div>
      </div>
    </div>
  );
}

// ── BAU VS CHANGE ─────────────────────────────────────────────────────────────
function BauChangeCard({ items }) {
  const committed = items.filter(i => i.state !== "Backlog");
  const bau    = committed.filter(i => i.tipo === "BAU");
  const change = committed.filter(i => i.tipo === "Change");
  const spBau    = bau.reduce((s,i)=>s+i.sp,0);
  const spChange = change.reduce((s,i)=>s+i.sp,0);
  const total = committed.length, spTotal = spBau + spChange;
  const rows = [
    { label:"Tareas", tot:total,   a:bau.length,  b:change.length, aSuf:"",     bSuf:"",     aPct:total?Math.round(bau.length/total*100):0,     bPct:total?Math.round(change.length/total*100):0 },
    { label:"Story Points", tot:spTotal, a:spBau, b:spChange,      aSuf:" SP",  bSuf:" SP",  aPct:spTotal?Math.round(spBau/spTotal*100):0,     bPct:spTotal?Math.round(spChange/spTotal*100):0 },
  ];
  return (
    <div style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:10, padding:"20px 24px", display:"flex", flexDirection:"column", gap:16 }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
        <div>
          <div style={{ fontSize:11, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.07em", color:C.muted, marginBottom:4 }}>Composición del sprint</div>
          <div style={{ fontSize:14, fontWeight:700, color:C.navy }}>BAU vs Change</div>
        </div>
        <Icon name="layers" size={16} color={C.faint} />
      </div>
      {rows.map(row => (
        <div key={row.label}>
          <span style={{ fontSize:11, color:C.muted, fontWeight:500 }}>{row.label} ({row.tot})</span>
          <div style={{ display:"flex", height:10, borderRadius:5, overflow:"hidden", gap:2, margin:"6px 0" }}>
            <div style={{ flex:row.a||0.001, background:C.navy,    borderRadius:"5px 0 0 5px", minWidth:4 }}></div>
            <div style={{ flex:row.b||0.001, background:C.magenta, borderRadius:"0 5px 5px 0", minWidth:4 }}></div>
          </div>
          <div style={{ display:"flex", justifyContent:"space-between" }}>
            {[{label:"BAU",color:C.navy,val:row.a,suf:row.aSuf,pct:row.aPct},{label:"Change",color:C.magenta,val:row.b,suf:row.bSuf,pct:row.bPct}].map(s=>(
              <div key={s.label} style={{ display:"flex", alignItems:"center", gap:6 }}>
                <div style={{ width:8, height:8, borderRadius:2, background:s.color }}></div>
                <span style={{ fontSize:12, color:C.muted }}>{s.label}</span>
                <span style={{ fontSize:13, fontWeight:700, color:s.color }}>{s.val}{s.suf}</span>
                <span style={{ fontSize:11, color:C.faint }}>({s.pct}%)</span>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

// ── TEAM GRID ─────────────────────────────────────────────────────────────────
const PERSON_COLORS = ["#0B4DB5","#8B1A6B","#1B6E5E","#7B3FB5","#B54A00","#005C80","#6B4A00"];
function personColor(name, idx) {
  const map = { "Ana Torres":"#0B4DB5","Carlos Ruiz":"#1B6E5E","Luis Vera":"#7B3FB5","María Silva":"#B54A00","Pedro Mora":"#8B1A6B","Roberto Castro":"#005C80","Sofía León":"#6B4A00" };
  return map[name] || PERSON_COLORS[idx % PERSON_COLORS.length];
}
function Avatar({ name, idx, size=32 }) {
  const color = personColor(name, idx||0);
  return (
    <div style={{ width:size, height:size, borderRadius:"50%", background:`${color}18`, border:`1.5px solid ${color}40`, color, display:"flex", alignItems:"center", justifyContent:"center", fontSize:size*0.33, fontWeight:700, flexShrink:0 }}>
      {initials(name)}
    </div>
  );
}
function TeamGrid({ items }) {
  const team = computeTeam(items);
  const overloaded = team.filter(p => p.overCapacity).length;
  return (
    <div style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:10, padding:"22px 24px", display:"flex", flexDirection:"column", gap:16, height:"100%" }}>
      <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", flexShrink:0, gap:10 }}>
        <div style={{ minWidth:0 }}>
          <div style={{ fontSize:11, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.07em", color:C.muted, marginBottom:4 }}>Carga por persona</div>
          <div style={{ fontSize:14, fontWeight:700, color:C.navy }}>SP en curso vs capacidad ({SP_CAPACITY})</div>
        </div>
        {overloaded > 0
          ? <span title="Personas con SP en curso por encima de la capacidad" style={{ fontSize:10, fontWeight:700, padding:"3px 7px", borderRadius:4, background:C.redBg, color:C.red, whiteSpace:"nowrap" }}>{overloaded} SOBRECARGAD{overloaded>1?"OS":"O"}</span>
          : <Icon name="users" size={16} color={C.faint} />}
      </div>
      <div style={{ display:"grid", gridTemplateColumns:`repeat(${team.length<=4?1:2},1fr)`, gap:6, overflowY:"auto", paddingRight:2 }}>
        {team.map((p,idx) => {
          const color = personColor(p.name,idx);
          const isBlocked = p.items.some(i=>i.state==="Blocked");
          const firstName = p.name.split(" ")[0];
          const statusColor = p.overCapacity ? C.red : p.nearCapacity ? C.amber : color;
          const rowBg      = p.overCapacity ? C.redBg : C.bg;
          const rowBorder  = p.overCapacity ? "#F7C1C1" : C.borderLight;
          const barFill    = Math.min(p.pctCapacity, 100);
          return (
            <div key={p.name} title={p.items.filter(i=>i.state==="Doing").map(i=>`${i.title} (${i.sp} SP)`).join(" · ") || "Sin items en progreso"}
              style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 12px", borderRadius:8, background:rowBg, border:`1px solid ${rowBorder}`, minWidth:0 }}>
              <Avatar name={p.name} idx={idx} size={30} />
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ display:"flex", alignItems:"center", gap:5, marginBottom:5 }}>
                  <span style={{ fontWeight:600, fontSize:12, color:C.navy, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{firstName}</span>
                  {isBlocked && <span style={{ fontSize:9, fontWeight:700, padding:"1px 5px", borderRadius:3, background:C.redBg, color:C.red, flexShrink:0 }}>BLOQ</span>}
                  <span style={{ fontSize:11, fontWeight:700, color:statusColor, marginLeft:"auto", flexShrink:0, whiteSpace:"nowrap" }}>
                    {p.spDoing}<span style={{ color:C.faint, fontWeight:500 }}>/{p.capacity}</span>
                    <span style={{ fontSize:10, color:C.muted, fontWeight:400, marginLeft:2 }}>SP</span>
                  </span>
                </div>
                <div style={{ height:5, borderRadius:3, background:C.borderLight, overflow:"hidden", position:"relative" }}>
                  <div style={{ width:`${barFill}%`, height:"100%", background:statusColor, borderRadius:3, transition:"width 0.5s ease" }}></div>
                  {p.overCapacity && <div style={{ position:"absolute", top:0, left:0, width:"100%", height:"100%", background:`repeating-linear-gradient(45deg, transparent, transparent 3px, rgba(255,255,255,0.4) 3px, rgba(255,255,255,0.4) 5px)`, pointerEvents:"none" }}></div>}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── THROUGHPUT CARD ───────────────────────────────────────────────────────────
function ThroughputCard({ data }) {
  const [view, setView] = useState("hu");
  const past    = data.filter(d => !d.current);
  const current = data.find(d => d.current);
  const vals    = past.map(d => view === "hu" ? d.hu : d.sp);
  const maxVal  = Math.max(...data.map(d => view==="hu"?d.hu:d.sp), 1);
  const avgPast = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : 0;
  const lastVal = past.length ? vals[vals.length-1] : 0;
  const trend   = lastVal > avgPast ? { sym:"↑", color:C.green, txt:"sobre promedio" }
                : lastVal < avgPast ? { sym:"↓", color:C.amber, txt:"bajo promedio" }
                : { sym:"→", color:C.muted, txt:"estable" };

  const CHART_H = 150;

  return (
    <div style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:10, padding:"22px 24px", display:"flex", flexDirection:"column", gap:18, height:"100%" }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
        <div>
          <div style={{ fontSize:11, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.07em", color:C.muted, marginBottom:4 }}>Throughput histórico</div>
          <div style={{ fontSize:14, fontWeight:700, color:C.navy }}>{view==="hu"?"HU":"Story Points"} completados por sprint</div>
        </div>
        <div style={{ display:"flex", gap:4 }}>
          {[{id:"hu",label:"HU"},{id:"sp",label:"SP"}].map(t=>(
            <button key={t.id} onClick={()=>setView(t.id)} style={{ fontSize:11, fontWeight:600, padding:"4px 10px", borderRadius:5, border:"1px solid", borderColor:view===t.id?C.navy:C.border, background:view===t.id?C.navy:"transparent", color:view===t.id?"#fff":C.muted, cursor:"pointer", fontFamily:"inherit" }}>{t.label}</button>
          ))}
        </div>
      </div>

      {/* Stats compactos */}
      <div style={{ display:"flex", gap:10 }}>
        <div style={{ flex:1, background:C.bg, borderRadius:8, padding:"10px 14px" }}>
          <div style={{ fontSize:10, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.06em", color:C.muted, marginBottom:2 }}>Promedio 6 sprints</div>
          <div style={{ fontSize:22, fontWeight:800, color:C.navy }}>{avgPast} <span style={{ fontSize:11, color:C.faint, fontWeight:500 }}>{view==="hu"?"HU":"SP"}</span></div>
        </div>
        <div style={{ flex:1, background:C.bg, borderRadius:8, padding:"10px 14px" }}>
          <div style={{ fontSize:10, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.06em", color:C.muted, marginBottom:2 }}>Sprint actual</div>
          <div style={{ display:"flex", alignItems:"baseline", gap:6 }}>
            <span style={{ fontSize:22, fontWeight:800, color:C.magenta }}>{view==="hu"?current?.hu:current?.sp}</span>
            <span style={{ fontSize:13, fontWeight:700, color:trend.color }}>{trend.sym}</span>
            <span style={{ fontSize:10, color:trend.color, fontWeight:600 }}>{trend.txt}</span>
          </div>
        </div>
      </div>

      {/* Bar chart */}
      <div style={{ flex:1, display:"flex", flexDirection:"column", justifyContent:"flex-end", minHeight:CHART_H + 50 }}>
        <div style={{ position:"relative", display:"flex", alignItems:"flex-end", gap:10, height:CHART_H, marginBottom:6 }}>
          {/* línea de promedio */}
          <div style={{ position:"absolute", left:0, right:0, bottom: Math.round(avgPast/maxVal*CHART_H), pointerEvents:"none", zIndex:1 }}>
            <div style={{ borderTop:`1px dashed ${C.amber}`, opacity:0.7 }}></div>
            <span style={{ position:"absolute", right:0, top:-13, fontSize:9, fontWeight:700, color:C.amber, background:"#fff", padding:"0 4px" }}>avg {avgPast}</span>
          </div>
          {data.map((d,i) => {
            const val = view==="hu" ? d.hu : d.sp;
            const h   = Math.max(Math.round(val/maxVal*CHART_H), 6);
            const isCurrent = d.current;
            return (
              <div key={i} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"flex-end", gap:4, height:"100%", position:"relative" }}>
                <span style={{ fontSize:11, fontWeight:700, color:isCurrent?C.magenta:C.navy }}>{val}</span>
                <div title={`${d.sprint}: ${val} ${view==="hu"?"HU":"SP"}`} style={{
                  width:"82%", height:h, borderRadius:"4px 4px 0 0",
                  background: isCurrent
                    ? `linear-gradient(180deg, ${C.magenta} 0%, ${C.magentaDark} 100%)`
                    : `linear-gradient(180deg, #A8B3CC 0%, #7C8AAB 100%)`,
                  boxShadow: isCurrent ? `0 2px 8px rgba(196,24,106,0.25)` : "none",
                  transition:"height 0.4s ease",
                }}></div>
              </div>
            );
          })}
        </div>
        {/* labels eje X */}
        <div style={{ display:"flex", gap:10 }}>
          {data.map((d,i) => (
            <span key={i} style={{ flex:1, textAlign:"center", fontSize:10, fontWeight:d.current?700:500, color:d.current?C.magenta:C.muted, whiteSpace:"nowrap" }}>{d.sprint}{d.current?" •":""}</span>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── PERSON DROPDOWN ───────────────────────────────────────────────────────────
function PersonDropdown({ allNames, selected, onChange }) {
  const [open, setOpen] = useState(false);
  const allSelected = selected.size === allNames.length;
  const label = allSelected ? "Equipo completo" : `${selected.size} persona${selected.size !== 1 ? "s" : ""}`;

  function toggle(name) {
    const next = new Set(selected);
    if (next.has(name)) {
      if (next.size === 1) return;
      next.delete(name);
    } else {
      next.add(name);
    }
    onChange(next);
  }

  const rowStyle = (active) => ({
    display:"flex", alignItems:"center", gap:9, padding:"8px 14px",
    cursor:"pointer", background: active ? C.navyLight : "transparent",
    transition:"background 0.12s",
  });

  return (
    <div style={{ position:"relative" }}
      onBlur={e => { if (!e.currentTarget.contains(e.relatedTarget)) setOpen(false); }}
      tabIndex={-1}>
      <button onClick={() => setOpen(o => !o)}
        style={{
          display:"flex", alignItems:"center", gap:7,
          padding:"7px 12px", borderRadius:7, cursor:"pointer", fontFamily:"inherit",
          background:"rgba(255,255,255,0.07)", border:"1px solid rgba(255,255,255,0.12)",
          color:"rgba(255,255,255,0.85)", fontSize:12, fontWeight:600,
          transition:"background 0.15s",
        }}
        onMouseEnter={e => e.currentTarget.style.background="rgba(255,255,255,0.13)"}
        onMouseLeave={e => e.currentTarget.style.background="rgba(255,255,255,0.07)"}>
        <Icon name="users" size={13} color="rgba(255,255,255,0.7)" />
        {label}
        <svg width={10} height={10} viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" strokeWidth={2.5} strokeLinecap="round" strokeLinejoin="round"
          style={{ transform: open ? "rotate(90deg)" : "none", transition:"transform 0.2s" }}>
          <path d="M9 18l6-6-6-6" />
        </svg>
      </button>

      {open && (
        <div style={{
          position:"absolute", right:0, top:"calc(100% + 8px)", zIndex:300,
          background:"#fff", border:`1px solid ${C.border}`, borderRadius:9,
          boxShadow:"0 8px 28px rgba(6,15,31,0.14)", minWidth:210, overflow:"hidden",
        }}>
          {/* Todos */}
          <div tabIndex={0}
            onClick={() => onChange(new Set(allNames))}
            onKeyDown={e => e.key==="Enter" && onChange(new Set(allNames))}
            style={{ ...rowStyle(allSelected), borderBottom:`1px solid ${C.borderLight}`, paddingTop:10, paddingBottom:10 }}
            onMouseEnter={e => e.currentTarget.style.background=C.navyLight}
            onMouseLeave={e => e.currentTarget.style.background=allSelected?C.navyLight:"transparent"}>
            <div style={{ width:16, height:16, borderRadius:4, border:`1.5px solid ${allSelected?C.navy:C.border}`, background:allSelected?C.navy:"transparent", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
              {allSelected && <svg width={10} height={10} viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth={3} strokeLinecap="round" strokeLinejoin="round"><path d="M4 13l5 5L20 7"/></svg>}
            </div>
            <span style={{ fontSize:12, fontWeight:700, color:C.navy }}>Todos</span>
            <span style={{ fontSize:11, color:C.muted, marginLeft:"auto" }}>{allNames.length}</span>
          </div>
          {/* Persons */}
          {allNames.map((name, idx) => {
            const active = selected.has(name);
            const color  = personColor(name, idx);
            return (
              <div key={name} tabIndex={0}
                onClick={() => toggle(name)}
                onKeyDown={e => e.key==="Enter" && toggle(name)}
                style={rowStyle(active)}
                onMouseEnter={e => e.currentTarget.style.background=C.navyLight}
                onMouseLeave={e => e.currentTarget.style.background=active?C.navyLight:"transparent"}>
                <div style={{ width:16, height:16, borderRadius:4, border:`1.5px solid ${active?color:C.border}`, background:active?color:"transparent", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                  {active && <svg width={10} height={10} viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth={3} strokeLinecap="round" strokeLinejoin="round"><path d="M4 13l5 5L20 7"/></svg>}
                </div>
                <Avatar name={name} idx={idx} size={22} />
                <span style={{ fontSize:12, fontWeight:500, color:C.navy }}>{name}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── PILL ──────────────────────────────────────────────────────────────────────
const STATE_STYLE = {
  "Done":             { bg:"#EBF5F0", color:"#0D5232", label:"Done" },
  "Doing":            { bg:"#EBF0FA", color:"#0B3F8A", label:"Doing" },
  "Blocked":          { bg:C.redBg,   color:C.red,     label:"Bloqueado" },
  "Revisión Calidad": { bg:"#F0EDF9", color:"#5A3A99", label:"En revisión" },
  "Backlog":          { bg:"#F2F3F5", color:C.muted,   label:"Backlog" },
};
function Pill({ state }) {
  const s = STATE_STYLE[state] || STATE_STYLE["Backlog"];
  return <span style={{ display:"inline-block", fontSize:11, fontWeight:600, padding:"3px 8px", borderRadius:4, background:s.bg, color:s.color, whiteSpace:"nowrap" }}>{s.label}</span>;
}

// ── ITEMS TABLE ───────────────────────────────────────────────────────────────
function ItemsTable({ items }) {
  const [filter, setFilter] = useState("todos");
  const [page,   setPage]   = useState(1);
  const PAGE_SIZE = 8;

  const tabs = [
    { id:"todos",      label:"Todos",       count:items.filter(i=>i.state!=="Backlog").length },
    { id:"bloqueados", label:"Bloqueados",  count:items.filter(i=>i.state==="Blocked").length },
    { id:"atrasados",  label:"Atrasados",   count:items.filter(i=>{ const d=diasAtraso(i.due,i.state); return d&&d>0; }).length },
    { id:"doing",      label:"En progreso", count:items.filter(i=>i.state==="Doing").length },
    { id:"revision",   label:"En revisión", count:items.filter(i=>i.state==="Revisión Calidad").length },
    { id:"done",       label:"Done",        count:items.filter(i=>i.state==="Done").length },
  ];
  const visible = useMemo(() => {
    let list = [...items];
    if      (filter==="bloqueados") list = list.filter(i=>i.state==="Blocked");
    else if (filter==="atrasados")  list = list.filter(i=>{ const d=diasAtraso(i.due,i.state); return d&&d>0; });
    else if (filter==="doing")      list = list.filter(i=>i.state==="Doing");
    else if (filter==="revision")   list = list.filter(i=>i.state==="Revisión Calidad");
    else if (filter==="done")       list = list.filter(i=>i.state==="Done");
    else                            list = list.filter(i=>i.state!=="Backlog");
    return list.sort((a,b)=>urgencyScore(a)-urgencyScore(b));
  }, [items, filter]);

  const totalPages = Math.ceil(visible.length / PAGE_SIZE);
  const paginated  = visible.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);
  useEffect(() => setPage(1), [filter]);

  const btnPage = active => ({
    width:32, height:32, display:"flex", alignItems:"center", justifyContent:"center",
    borderRadius:6, border:`1px solid ${active?C.navy:C.border}`,
    background:active?C.navy:"#fff", color:active?"#fff":C.muted,
    fontSize:12, fontWeight:600, cursor:"pointer", fontFamily:"inherit",
  });

  const COLS = ["Título","Responsable","Estado","Área","Due date","SP"];

  return (
    <div style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:10, overflow:"hidden" }}>
      <div style={{ padding:"14px 20px 0", borderBottom:`1px solid ${C.border}` }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14, flexWrap:"wrap", gap:10 }}>
          <div style={{ fontWeight:700, fontSize:14, color:C.navy }}>Items del sprint</div>
          <div style={{ display:"flex", gap:4, flexWrap:"wrap" }}>
            {tabs.map(t => (
              <button key={t.id} onClick={()=>setFilter(t.id)} style={{
                fontSize:11, fontWeight:600, padding:"5px 11px", borderRadius:5, border:"1px solid",
                borderColor:filter===t.id?C.navy:C.border, background:filter===t.id?C.navy:"transparent",
                color:filter===t.id?"#fff":C.muted, cursor:"pointer", fontFamily:"inherit", transition:"all 0.15s",
              }}>
                {t.label}{t.count>0?<span style={{ marginLeft:4, opacity:0.65 }}>{t.count}</span>:""}
              </button>
            ))}
          </div>
        </div>
      </div>
      <div style={{ overflowX:"auto" }}>
        <table style={{ width:"100%", borderCollapse:"collapse" }}>
          <thead>
            <tr>
              {COLS.map((h,i) => (
                <th key={i} style={{ fontSize:10, fontWeight:600, color:C.muted, textAlign:"left", padding:"8px 16px", background:"#FAFBFD", borderBottom:`1px solid ${C.border}`, textTransform:"uppercase", letterSpacing:"0.06em", whiteSpace:"nowrap" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {paginated.length===0 && (
              <tr><td colSpan={COLS.length} style={{ textAlign:"center", padding:"2.5rem", color:C.faint, fontSize:13 }}>Sin items en esta categoría</td></tr>
            )}
            {paginated.map((item,idx) => {
              const isBlocked = item.state === "Blocked";
              return (
                <tr key={item.id} style={{ borderBottom:`1px solid ${C.borderLight}` }}
                  onMouseEnter={e=>e.currentTarget.style.background="#FAFBFD"}
                  onMouseLeave={e=>e.currentTarget.style.background=""}>
                  <td style={{ padding:"0 16px", height:46, maxWidth:280 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      {isBlocked && <div style={{ width:3, height:20, borderRadius:2, background:C.red, flexShrink:0 }}></div>}
                      <div style={{ overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", fontWeight:500, fontSize:13, color:C.navy }}>{item.title}</div>
                    </div>
                  </td>
                  <td style={{ padding:"0 16px", height:46 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:7 }}>
                      <Avatar name={item.assignedTo} idx={idx} size={22} />
                      <span style={{ fontSize:12, color:C.muted }}>{item.assignedTo.split(" ")[0]}</span>
                    </div>
                  </td>
                  <td style={{ padding:"0 16px", height:46 }}><Pill state={item.state} /></td>
                  <td style={{ padding:"0 16px", height:46 }}>
                    {item.area
                      ? <span style={{ fontSize:11, padding:"2px 8px", borderRadius:4, background:C.bg, color:C.muted, border:`1px solid ${C.border}` }}>{item.area}</span>
                      : <span style={{ color:C.faint }}>—</span>}
                  </td>
                  <td style={{ padding:"0 16px", height:46 }}>
                    <DueDateCell due={item.due} state={item.state} />
                  </td>
                  <td style={{ padding:"0 16px", height:46 }}>
                    <span style={{ fontSize:13, fontWeight:700, color:item.state==="Done"?C.green:C.navy }}>{item.sp}</span>
                    <span style={{ fontSize:11, color:C.faint, marginLeft:3 }}>SP</span>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {totalPages > 1 && (
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"12px 20px", borderTop:`1px solid ${C.borderLight}` }}>
          <span style={{ fontSize:12, color:C.muted }}>{(page-1)*PAGE_SIZE+1}–{Math.min(page*PAGE_SIZE,visible.length)} de {visible.length} items</span>
          <div style={{ display:"flex", gap:4 }}>
            <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1} style={{ ...btnPage(false), opacity:page===1?0.4:1 }}>‹</button>
            {Array.from({length:totalPages},(_,i)=>i+1).map(p=>(
              <button key={p} onClick={()=>setPage(p)} style={btnPage(p===page)}>{p}</button>
            ))}
            <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={page===totalPages} style={{ ...btnPage(false), opacity:page===totalPages?0.4:1 }}>›</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [showModal, setShowModal] = useState(false);
  const [context, setContext] = useState({ proyecto:MOCK_SPRINT_INFO.proyecto, equipo:MOCK_SPRINT_INFO.equipo, sprint:MOCK_SPRINT_INFO.sprint });

  const allPersonNames = useMemo(() => [...new Set(MOCK_ITEMS.map(i => i.assignedTo))].sort(), []);
  const [selectedPersons, setSelectedPersons] = useState(() => new Set(allPersonNames));

  const info          = { ...MOCK_SPRINT_INFO, ...context };
  const allItems      = MOCK_ITEMS;
  const filteredItems = useMemo(() => allItems.filter(i => selectedPersons.has(i.assignedTo)), [selectedPersons]);
  const stats         = useMemo(() => computeStats(filteredItems), [filteredItems]);
  const dayPct        = sprintDayProgress(MOCK_SPRINT_INFO.inicio, MOCK_SPRINT_INFO.fin);
  const restantes     = daysUntilEnd(MOCK_SPRINT_INFO.fin);
  const todayStr      = TODAY.toLocaleDateString("es-EC", { day:"2-digit", month:"long", year:"numeric" });
  const team          = useMemo(() => computeTeam(filteredItems), [filteredItems]);
  const overloaded    = team.filter(p => p.overCapacity).length;

  return (
    <div style={{ minHeight:"100vh", background:C.bg }}>
      <Header info={info} onRefresh={()=>{}} onChangeProject={()=>setShowModal(true)}
        personFilter={<PersonDropdown allNames={allPersonNames} selected={selectedPersons} onChange={setSelectedPersons} />} />

      <div style={{ maxWidth:1280, margin:"0 auto", padding:"28px 36px 40px", display:"flex", flexDirection:"column", gap:18 }}>

        {/* KPIs */}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:14 }}>
          <KpiCard label="Tiempo del sprint"  value={`${dayPct}%`}                    sub={`${restantes}d restante${restantes!==1?"s":""} · ${info.sprint}`}   icon="clock"    iconColor={C.muted} />
          <KpiCard label="% Compromiso cumplido" value={`${stats.pctItems}%`}         sub={`${stats.done.length}/${stats.committed.length} tareas · ${stats.pctSP}% SP`} icon="check" iconColor={C.green} />
          <KpiCard label="SP entregados"      value={`${stats.spDone} SP`}             valueColor={C.magenta} sub={`de ${stats.spTotal} comprometidos`}          icon="layers"   iconColor={C.magenta} />
          <KpiCard label="Sobrecargados"      value={overloaded}                       valueColor={overloaded>0?C.red:C.faint} sub={`personas con SP en curso > ${SP_CAPACITY}`} icon="zap" iconColor={overloaded>0?C.red:C.faint} />
          <KpiCard label="Bloqueados"         value={stats.blocked.length}             valueColor={stats.blocked.length>0?C.red:C.faint} sub={`${stats.spBlocked} SP detenidos`} icon="lock" iconColor={stats.blocked.length>0?C.red:C.faint} />
        </div>

        {/* Fila 1: Esfuerzo + BAU/Change + Team (carga por persona) */}
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1.2fr", gap:14, alignItems:"stretch" }}>
          <EsfuerzoCard stats={stats} />
          <BauChangeCard items={filteredItems} />
          <TeamGrid items={filteredItems} />
        </div>

        {/* Fila 2: Throughput a ancho completo */}
        <ThroughputCard data={MOCK_THROUGHPUT} />

        <ItemsTable items={filteredItems} />

        <div style={{ fontSize:11, color:C.faint, textAlign:"center" }}>
          {info.proyecto} · {info.equipo} · Banco Guayaquil · Datos de demostración · {todayStr}
        </div>
      </div>

      {showModal && <ContextModal context={context} onApply={ctx=>{ setContext(ctx); setShowModal(false); }} onClose={()=>setShowModal(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
